name: Manually deliver AgentRouter Desktop

on:
  workflow_dispatch:
    inputs:
      delivery:
        description: Product delivery lane
        type: choice
        options: [coordinated, legacy]
        default: coordinated
      publish:
        description: Publish the reviewed release after installed acceptance
        type: boolean
        default: false
      resume_signed_run:
        description: Resume an existing signed release from this completed run without rebuilding
        type: string
        default: ''
      rehearse_signed:
        description: Sign and stage a never-published rehearsal draft (rehearsal-<run>), run every signed check, then delete it; requires publish=false
        type: boolean
        default: false
      profile:
        description: Release profile (hotfix defers only the unsigned pre-sign duplicate of the signed installed checks; recorded in the receipt)
        type: choice
        options: [standard, hotfix]
        default: standard
      retain_plugin_reason:
        description: Only for an intentional older-plugin maintenance release; recorded in the release receipt
        type: string
        default: ''
      force:
        description: Rebuild the currently locked version
        type: boolean
        required: false
        default: false

permissions: {}

env:
  # coordinated-release.mjs stages rehearsal-<run> instead of the version tag and refuses publication.
  AGENTROUTER_REHEARSAL: ${{ inputs.rehearse_signed && '1' || '' }}

concurrency:
  group: agentrouter-desktop-release
  cancel-in-progress: false

jobs:
  probe:
    name: Check npm
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.delivery == 'legacy' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      changed: ${{ steps.npm.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
      - name: Install pinned Corepack in the runner temp directory
        shell: bash
        run: |
          corepack_prefix="$RUNNER_TEMP/corepack"
          npm install --prefix "$corepack_prefix" --no-audit --no-fund corepack@0.36.0
          echo "$corepack_prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "AGENTROUTER_COREPACK=$corepack_prefix/node_modules/corepack/dist/corepack.js" >> "$GITHUB_ENV"
      - run: npm test
      - name: Resolve and verify the configured npm dist-tags
        id: npm
        run: node assembly/check-npm-updates.mjs --write --report "$RUNNER_TEMP/npm-report.json"
      - name: Refresh the immutable assembly lock
        if: steps.npm.outputs.changed == 'true'
        run: npm run assembly:refresh-lock
      - name: Decide whether a release is needed
        id: decide
        env:
          CHANGED: ${{ steps.npm.outputs.changed }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          if [[ "$CHANGED" == 'true' || "$FORCE" == 'true' ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Pass the exact lock to the Windows build
        if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-lock
          path: |
            assembly/plugins.lock.json
            assembly/yarn.lock
          if-no-files-found: error
          retention-days: 1

  release:
    name: Build and publish the formal Windows release
    needs: probe
    if: needs.probe.outputs.publish == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-lock
          path: assembly
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
      - name: Install pinned Corepack in the runner temp directory
        shell: pwsh
        run: |
          $corepackPrefix = Join-Path $env:RUNNER_TEMP 'corepack'
          npm install --prefix $corepackPrefix --no-audit --no-fund corepack@0.36.0
          if ($LASTEXITCODE -ne 0) { throw 'Corepack installation failed' }
          Join-Path $corepackPrefix 'node_modules/.bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $corepackEntry = Join-Path $corepackPrefix 'node_modules/corepack/dist/corepack.js'
          if (!(Test-Path -LiteralPath $corepackEntry -PathType Leaf)) { throw 'Corepack entry point is missing' }
          "AGENTROUTER_COREPACK=$corepackEntry" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm test
      - name: Build the locked upstream with the verified npm packages
        id: build
        run: npm run build:win
      - name: Resolve the single installer
        id: installer
        shell: pwsh
        env:
          BUILD_DIRECTORY: ${{ steps.build.outputs.directory }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath $env:BUILD_DIRECTORY -File | Where-Object Name -Like '*-Setup.exe')
          if ($files.Count -ne 1) { throw "Expected one installer, found $($files.Count)" }
          "path=$($files[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Stage build evidence in the workspace
        shell: pwsh
        env:
          CANDIDATE_RECEIPT: ${{ steps.build.outputs.receipt }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'artifacts/build-evidence'
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath $env:CANDIDATE_RECEIPT -Destination $evidence
          Copy-Item -LiteralPath $env:INSTALLER_PATH -Destination $evidence
      - name: Install and smoke-test the exact build
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'agentrouter-desktop-release'
          if (Test-Path -LiteralPath $installDir) { throw 'Fresh installation directory already exists' }
          $installed = Start-Process -FilePath $env:INSTALLER_PATH -ArgumentList '/S', '/currentuser', "/D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          $executable = Join-Path $installDir 'DSH Desktop.exe'
          if (!(Test-Path -LiteralPath $executable)) { throw 'Installed executable is missing' }
          npm install --prefix artifacts/desktop-smoke-deps --ignore-scripts --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser driver installation failed' }
          node assembly/smoke-desktop.mjs "$executable" "$env:GITHUB_WORKSPACE/artifacts/installed-acceptance"
          if ($LASTEXITCODE -ne 0) { throw 'Installed client startup failed' }
          $result = Get-Content artifacts/installed-acceptance/native-smoke.json -Raw | ConvertFrom-Json
          if (!$result.passed) { throw 'Native acceptance did not pass' }
          $result.installerExecuted = $true
          $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 artifacts/installed-acceptance/installed-smoke.json
      - name: Create the formal GitHub Release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RECEIPT: ${{ steps.build.outputs.receipt }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $lock = Get-Content assembly/plugins.lock.json -Raw | ConvertFrom-Json
          $upstream = Get-Content assembly/upstream.lock.json -Raw | ConvertFrom-Json
          $version = $upstream.tag.TrimStart('v')
          $tag = "v$version-preinstalled.$($lock.releaseSequence)"
          if ($tag -notmatch '^v\d+\.\d+\.\d+-preinstalled\.\d+$') { throw 'Invalid release tag' }

          $candidate = Get-Content -LiteralPath $env:CANDIDATE_RECEIPT -Raw | ConvertFrom-Json
          $installer = Get-Item -LiteralPath $env:INSTALLER_PATH
          $expected = @($candidate.assets | Where-Object name -EQ $installer.Name)
          if ($expected.Count -ne 1) { throw 'Installer is absent from candidate receipt' }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          if ($installer.Length -ne $expected[0].bytes -or $digest -ne $expected[0].sha256) { throw 'Installer bytes differ from candidate receipt' }

          $releaseDir = Join-Path $env:RUNNER_TEMP 'agentrouter-formal-release'
          New-Item -ItemType Directory -Path $releaseDir -ErrorAction Stop | Out-Null
          $checksums = Join-Path $releaseDir 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($checksums, "$digest  $($installer.Name)`n", [Text.UTF8Encoding]::new($false))
          $notes = Join-Path $releaseDir 'RELEASE_NOTES.md'
          $packageLines = ($lock.packages | ForEach-Object { "- ``$($_.name)@$($_.version)``" }) -join "`n"
          [IO.File]::WriteAllText($notes, "# AgentRouter Desktop $($tag.TrimStart('v'))`n`n正式 Windows x64 Release。安装包暂未签名，Windows 可能显示未知发布者提示。`n`n$packageLines`n`nSHA-256: ``$digest```n", [Text.UTF8Encoding]::new($false))
          $buildRoot = Split-Path -Parent $env:CANDIDATE_RECEIPT
          $license = Join-Path $buildRoot 'source/LICENSE'
          $notices = Join-Path $buildRoot 'source/dsh-plugin-desktop/THIRD_PARTY_NOTICES.md'
          foreach ($path in @($license, $notices, $env:CANDIDATE_RECEIPT, 'artifacts/installed-acceptance/installed-smoke.json')) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release evidence: $path" }
          }

          gh release view "$tag" --repo "$repo" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" "$($installer.FullName)" "$checksums" "$env:CANDIDATE_RECEIPT" "$license" "$notices" 'artifacts/installed-acceptance/installed-smoke.json' --repo "$repo" --title "AgentRouter Desktop $($tag.TrimStart('v'))" --notes-file "$notes" --latest
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
          }

          $encodedTag = [Uri]::EscapeDataString($tag)
          $release = gh api "repos/$repo/releases/tags/$encodedTag" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw 'Release is not formal' }
          $remote = @($release.assets | Where-Object name -EQ $installer.Name)
          if ($remote.Count -ne 1 -or $remote[0].size -ne $installer.Length) { throw 'Published installer size mismatch' }
          if ($remote[0].digest -and $remote[0].digest -ne "sha256:$digest") { throw 'Published installer digest mismatch' }
          $download = Join-Path $env:RUNNER_TEMP $installer.Name
          Invoke-WebRequest -Uri $remote[0].browser_download_url -OutFile $download -MaximumRedirection 10
          if ((Get-Item -LiteralPath $download).Length -ne $installer.Length -or (Get-FileHash -Algorithm SHA256 -LiteralPath $download).Hash.ToLowerInvariant() -ne $digest) {
            throw 'Anonymous Release download mismatch'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Save the released npm lock
        if: needs.probe.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'agentrouter-release[bot]'
          git config user.email 'agentrouter-release[bot]@users.noreply.github.com'
          git add assembly/plugins.lock.json assembly/yarn.lock
          git commit -m "chore: lock npm packages for $env:RELEASE_TAG [skip ci]"
          $basicCredential = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basicCredential"
          $env:GIT_TERMINAL_PROMPT = '0'
          git push origin HEAD:main
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-${{ github.run_id }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
          path: artifacts/

  # Coordinated lane: reuse ci.yml installed acceptance of identical product
  # inputs when it exists, sign once, then run every signed installed check
  # against the staged draft in parallel on separate disposable workers.
  coordinated_evidence:
    name: Select reusable installed acceptance evidence
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.delivery == 'coordinated' && (inputs.publish || inputs.rehearse_signed) && inputs.resume_signed_run == ''
    runs-on: ubuntu-latest
    # Includes the bounded npm wait (PLUGIN_WAIT_MINUTES=20) for a release
    # dispatched as soon as the plugin authorization merges.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      found: ${{ steps.evidence.outputs.found }}
      evidence: ${{ steps.evidence.outputs.evidence }}
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Refuse a rehearsal that could publish
        if: inputs.rehearse_signed
        env:
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          if [ "$PUBLISH" = "true" ]; then echo "::error::rehearse_signed requires publish=false"; exit 1; fi
      - name: Require a reviewed formal version before publication
        shell: pwsh
        run: |
          $release = Get-Content assembly/coordinated/release.json -Raw | ConvertFrom-Json
          if ($release.candidateOnly) { throw 'The product version is still candidate-only' }
      - name: Wait for npm to serve the locked plugin bytes
        if: inputs.retain_plugin_reason == ''
        env:
          PLUGIN_WAIT_MINUTES: '20'
        run: node assembly/wait-plugin.mjs --require-next
      - id: selection
        name: Check published modules are included before expensive acceptance
        env:
          RETAIN_PLUGIN_REASON: ${{ inputs.retain_plugin_reason }}
        run: node assembly/coordinated-inputs.mjs
      - run: npm test
      - id: evidence
        name: Find a ci.yml run that installed these exact product inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node assembly/coordinated-evidence.mjs

  coordinated:
    name: Accept coordinated installers before signing
    needs: coordinated_evidence
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.delivery == 'coordinated' && inputs.resume_signed_run == '' && ((!inputs.publish && !inputs.rehearse_signed) || (needs.coordinated_evidence.result == 'success' && needs.coordinated_evidence.outputs.found != 'true' && inputs.profile != 'hotfix')) }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      receipt: ${{ steps.accept.outputs.receipt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: npm test
      - run: node assembly/retry-install.mjs npm ci --ignore-scripts --prefix assembly/coordinated
      - run: node assembly/coordinated/test.mjs
      - id: accept
        run: node assembly/coordinated-candidate.mjs

  coordinated_sign:
    name: Sign and stage the exact product release
    needs: [coordinated_evidence, coordinated]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.delivery == 'coordinated' && (inputs.publish || inputs.rehearse_signed) && inputs.resume_signed_run == '' && needs.coordinated_evidence.result == 'success' && (needs.coordinated_evidence.outputs.found == 'true' || needs.coordinated.result == 'success' || (inputs.profile == 'hotfix' && needs.coordinated.result == 'skipped')) }}
    runs-on: windows-2025
    environment: windows-signing
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.stage.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: npm test
      - run: node assembly/retry-install.mjs npm ci --ignore-scripts --prefix assembly/coordinated
      - name: Build the reviewed source with the public plugin
        id: build
        shell: pwsh
        run: |
          node assembly/coordinated/build.mjs > candidate-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content candidate-build.log -Tail 60; throw 'Product build failed' }
          $built = Get-Content candidate-build.log -Tail 1 | ConvertFrom-Json
          "candidate=$($built.candidate)" >> $env:GITHUB_OUTPUT
      - name: Import the reviewed self-signed key without changing Windows root trust
        shell: pwsh
        env:
          AGENTROUTER_SIGNING_PFX: ${{ secrets.AGENTROUTER_SIGNING_PFX }}
          AGENTROUTER_SIGNING_PASSWORD: ${{ secrets.AGENTROUTER_SIGNING_PASSWORD }}
        run: ./assembly/coordinated/import-signing-key.ps1
      - name: Sign NSIS and its update manifest with the reviewed identity
        id: package
        shell: pwsh
        env:
          CANDIDATE_FILE: ${{ steps.build.outputs.candidate }}
        run: |
          node assembly/coordinated/package-installer.mjs "$env:CANDIDATE_FILE" > installer-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content installer-build.log -Tail 60; throw 'Signed installer failed' }
          $packaged = Get-Content installer-build.log -Tail 1 | ConvertFrom-Json
          "receipt=$($packaged.installerReceipt)" >> $env:GITHUB_OUTPUT
      - name: Stage signed bytes as an unpublished draft without changing the product feed
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RECEIPT: ${{ steps.package.outputs.receipt }}
          ACCEPTED_CANDIDATE_JSON: ${{ needs.coordinated.outputs.receipt }}
          ACCEPTANCE_EVIDENCE_JSON: ${{ needs.coordinated_evidence.outputs.evidence }}
          RELEASE_SELECTION_JSON: ${{ needs.coordinated_evidence.outputs.selection }}
          RELEASE_PROFILE: ${{ inputs.profile }}
        run: |
          node assembly/coordinated-release.mjs stage "$env:INSTALLER_RECEIPT"
          if ($LASTEXITCODE -ne 0) { throw 'Signed release staging failed' }
          $release = Get-Content assembly/coordinated/release.json -Raw | ConvertFrom-Json
          if ($env:AGENTROUTER_REHEARSAL -eq '1') { "tag=rehearsal-$env:GITHUB_RUN_ID" >> $env:GITHUB_OUTPUT }
          else { "tag=v$($release.productVersion)" >> $env:GITHUB_OUTPUT }
      - name: Remove the temporary signing key
        if: always()
        shell: pwsh
        run: |
          if ($env:AGENTROUTER_SIGNING_CERT_THUMBPRINT -match '^[A-Fa-f0-9]{40}$') {
            $key = "Cert:/CurrentUser/My/$env:AGENTROUTER_SIGNING_CERT_THUMBPRINT"
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -DeleteKey -Force }
          }

  # The signed loopback baseline depends only on the pinned baseline, the plugin
  # bytes, the signing identity and this commit's adapter, so it is signed on its
  # own worker while the product is signed. It travels to the update worker as a
  # never-published draft of this run (visible only to repository writers, never
  # a product asset or feed) and is re-verified before installation.
  coordinated_signed_baseline:
    name: Sign the loopback update baseline
    needs: coordinated_evidence
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.delivery == 'coordinated' && (inputs.publish || inputs.rehearse_signed) && inputs.resume_signed_run == '' && needs.coordinated_evidence.result == 'success' }}
    runs-on: windows-2025
    environment: windows-signing
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: node assembly/retry-install.mjs npm ci --ignore-scripts --prefix assembly/coordinated
      - name: Import the reviewed self-signed key without changing Windows root trust
        shell: pwsh
        env:
          AGENTROUTER_SIGNING_PFX: ${{ secrets.AGENTROUTER_SIGNING_PFX }}
          AGENTROUTER_SIGNING_PASSWORD: ${{ secrets.AGENTROUTER_SIGNING_PASSWORD }}
        run: ./assembly/coordinated/import-signing-key.ps1
      - name: Build and sign the loopback baseline from the reviewed release input
        shell: pwsh
        run: |
          node assembly/coordinated/installer-acceptance.mjs assembly/coordinated/release.json --prepare-baseline=.local/signed-baseline > signed-baseline.log
          if ($LASTEXITCODE -ne 0) { Get-Content signed-baseline.log -Tail 60; throw 'Signed baseline preparation failed' }
          Get-Content signed-baseline.log -Tail 1
      - name: Stage the baseline as this run's never-published draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node assembly/run-drafts.mjs stage-baseline .local/signed-baseline
      - name: Remove the temporary signing key
        if: always()
        shell: pwsh
        run: |
          if ($env:AGENTROUTER_SIGNING_CERT_THUMBPRINT -match '^[A-Fa-f0-9]{40}$') {
            $key = "Cert:/CurrentUser/My/$env:AGENTROUTER_SIGNING_CERT_THUMBPRINT"
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -DeleteKey -Force }
          }

  coordinated_signed_update:
    name: Signed native update and restart
    needs: [coordinated_sign, coordinated_signed_baseline]
    if: ${{ !cancelled() && needs.coordinated_sign.result == 'success' && needs.coordinated_signed_baseline.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: node assembly/retry-install.mjs npm ci --ignore-scripts --prefix assembly/coordinated
      - name: Download the exact draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.coordinated_sign.outputs.tag }}
        run: gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --dir .local/signed-release
      - name: Verify the draft was staged from this commit by this run
        run: node assembly/coordinated-release.mjs signed-target .local/signed-release .local/signed-installer.json
      - name: Download this run's signed baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node assembly/run-drafts.mjs download-baseline .local/signed-baseline
      - name: Build the reviewed source for the installed target metadata
        id: build
        shell: pwsh
        run: |
          node assembly/coordinated/build.mjs > candidate-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content candidate-build.log -Tail 60; throw 'Product build failed' }
          $built = Get-Content candidate-build.log -Tail 1 | ConvertFrom-Json
          "candidate=$($built.candidate)" >> $env:GITHUB_OUTPUT
      - name: Exercise native signed update and restart using these exact release bytes
        id: accept
        shell: pwsh
        env:
          CANDIDATE_FILE: ${{ steps.build.outputs.candidate }}
        run: |
          node assembly/coordinated/installer-acceptance.mjs "$env:CANDIDATE_FILE" --scenario=native-updater --signed-installer=.local/signed-installer.json --baseline-package=.local/signed-baseline > signed-update.log
          if ($LASTEXITCODE -ne 0) { Get-Content signed-update.log -Tail 60; throw 'Native signed update acceptance failed' }
          $accepted = Get-Content signed-update.log -Tail 1 | ConvertFrom-Json
          "receipt=$($accepted.receipt)" >> $env:GITHUB_OUTPUT
      - name: Record the signed update on this run's draft
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RECEIPT: ${{ steps.accept.outputs.receipt }}
        run: node assembly/coordinated-release.mjs record .local/signed-release native-updater "$env:ACCEPTANCE_RECEIPT"

  coordinated_signed_legacy:
    name: Signed legacy Profile migration
    needs: coordinated_sign
    if: ${{ !cancelled() && needs.coordinated_sign.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: node assembly/retry-install.mjs npm ci --ignore-scripts --prefix assembly/coordinated
      - name: Download the exact draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.coordinated_sign.outputs.tag }}
        run: gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --dir .local/signed-release
      - name: Verify the draft was staged from this commit by this run
        run: node assembly/coordinated-release.mjs signed-target .local/signed-release .local/signed-installer.json
      - name: Build the reviewed source for the installed target metadata
        id: build
        shell: pwsh
        run: |
          node assembly/coordinated/build.mjs > candidate-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content candidate-build.log -Tail 60; throw 'Product build failed' }
          $built = Get-Content candidate-build.log -Tail 1 | ConvertFrom-Json
          "candidate=$($built.candidate)" >> $env:GITHUB_OUTPUT
      - name: Migrate the previous public Desktop Profile into these exact signed bytes
        id: accept
        shell: pwsh
        env:
          CANDIDATE_FILE: ${{ steps.build.outputs.candidate }}
        run: |
          node assembly/coordinated/installer-acceptance.mjs "$env:CANDIDATE_FILE" --scenario=legacy-migration --signed-installer=.local/signed-installer.json > signed-legacy.log
          if ($LASTEXITCODE -ne 0) { Get-Content signed-legacy.log -Tail 60; throw 'Signed legacy migration acceptance failed' }
          $accepted = Get-Content signed-legacy.log -Tail 1 | ConvertFrom-Json
          "receipt=$($accepted.receipt)" >> $env:GITHUB_OUTPUT
      - name: Record the signed legacy migration on this run's draft
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RECEIPT: ${{ steps.accept.outputs.receipt }}
        run: node assembly/coordinated-release.mjs record .local/signed-release legacy-migration "$env:ACCEPTANCE_RECEIPT"

  coordinated_signed_install:
    name: Install signed bytes on a clean worker
    needs: coordinated_sign
    if: ${{ !cancelled() && needs.coordinated_sign.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: node assembly/retry-install.mjs npm ci --ignore-scripts --prefix assembly/coordinated
      - name: Download the exact draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.coordinated_sign.outputs.tag }}
        run: gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --dir .local/signed-release
      - name: Verify Authenticode and install the signed product
        run: node assembly/coordinated-release.mjs accept .local/signed-release
      - name: Record the clean-worker installation on this run's draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node assembly/coordinated-release.mjs record .local/signed-release fresh-install

  # Schemas are additive only: the staged signed feed must be accepted by the
  # verifier code of the last published client versions before publication.
  # Runs beside the signed installed checks on a small Ubuntu worker.
  coordinated_feed_compat:
    name: Verify the signed feed with published client verifiers
    needs: coordinated_sign
    if: ${{ !cancelled() && needs.coordinated_sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Draft releases are visible only to tokens with push access.
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: git fetch --tags --force origin
      - run: node assembly/retry-install.mjs npm ci --ignore-scripts --prefix assembly/coordinated
      - name: Download the exact draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.coordinated_sign.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .local/signed-release
      - name: Check the draft with the verifiers of the last six published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node assembly/feed-compat.mjs .local/signed-release

  coordinated_publish:
    name: Publish the accepted signed release and verify delivery
    needs: [coordinated_sign, coordinated_signed_update, coordinated_signed_legacy, coordinated_signed_install, coordinated_feed_compat]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.delivery == 'coordinated' && inputs.publish && !inputs.rehearse_signed && ((needs.coordinated_sign.result == 'success' && needs.coordinated_signed_update.result == 'success' && needs.coordinated_signed_legacy.result == 'success' && needs.coordinated_signed_install.result == 'success' && needs.coordinated_feed_compat.result == 'success') || inputs.resume_signed_run != '') }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: node assembly/retry-install.mjs npm ci --ignore-scripts --prefix assembly/coordinated
      - name: Download the exact draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.coordinated_sign.outputs.tag }}
        run: |
          if (!$env:RELEASE_TAG) {
            $release = Get-Content assembly/coordinated/release.json -Raw | ConvertFrom-Json
            $env:RELEASE_TAG = "v$($release.productVersion)"
          }
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --dir .local/signed-release
      - name: Validate the original signed run before resuming
        if: inputs.resume_signed_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_SIGNED_RUN: ${{ inputs.resume_signed_run }}
        run: node assembly/coordinated-recovery.mjs .local/signed-release
      - name: Verify Authenticode and install the signed product again before resuming
        if: inputs.resume_signed_run != ''
        run: node assembly/coordinated-release.mjs accept .local/signed-release
      - name: Check the resumed assets with the verifiers of the last six published versions
        if: inputs.resume_signed_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          if ($LASTEXITCODE -ne 0) { throw 'Fetching release tags failed' }
          node assembly/feed-compat.mjs .local/signed-release
          if ($LASTEXITCODE -ne 0) { throw 'A published client verifier rejects the resumed release' }
      - name: Publish and verify the website, downloads and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node assembly/coordinated-release.mjs publish .local/signed-release
      - name: Warm and verify the website download mirror (installer, blockmap, manifest, then latest.yml)
        env:
          GH_TOKEN: ${{ github.token }}
          # Report-only until the Cloud mirror route serves blockmaps and the feed; then set to 'true'.
          MIRROR_REQUIRED: 'false'
        run: node assembly/mirror-verify.mjs
  coordinated_outcome:
    name: Require the requested publication
    # A requested publication must never report success while any gate was
    # skipped: GitHub skips dependants of a skipped job unless told otherwise.
    needs: [coordinated_evidence, coordinated_sign, coordinated_signed_update, coordinated_signed_legacy, coordinated_signed_install, coordinated_feed_compat, coordinated_publish]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.delivery == 'coordinated' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless the release was published
        env:
          PUBLISH_RESULT: ${{ needs.coordinated_publish.result }}
        run: |
          if [ "$PUBLISH_RESULT" != "success" ]; then
            echo "::error::Publication was requested but the publish job result is '$PUBLISH_RESULT'"
            exit 1
          fi
  coordinated_timeline:
    name: Release timeline and budgets
    # Always measured after a coordinated run: per-job queue/duration against
    # assembly/release-budgets.json. A failed job or breach opens an incident.
    needs: [coordinated_evidence, coordinated, coordinated_sign, coordinated_signed_baseline, coordinated_signed_update, coordinated_signed_legacy, coordinated_signed_install, coordinated_feed_compat, coordinated_publish]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.delivery == 'coordinated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Report the timeline and open an incident on failure or budget breach
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PROFILE: ${{ inputs.profile }}
          TIMELINE_JOB_NAME: Release timeline and budgets
        run: node assembly/release-timeline.mjs ${{ inputs.publish && '--incident' || '' }}

  coordinated_run_drafts:
    name: Remove this run's never-published drafts
    # Deletes only baseline-<run> and, in a rehearsal, rehearsal-<run>, after
    # rechecking each is a never-published draft. Product version drafts stay.
    needs: [coordinated_signed_baseline, coordinated_sign, coordinated_signed_update, coordinated_signed_legacy, coordinated_signed_install, coordinated_publish]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.delivery == 'coordinated' && (inputs.publish || inputs.rehearse_signed) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Delete this run's baseline and rehearsal drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node assembly/run-drafts.mjs cleanup
