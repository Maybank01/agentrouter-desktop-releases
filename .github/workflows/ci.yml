name: Assembly boundaries

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assembly-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Source boundaries and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
      - run: npm test
      - run: git diff --check
  coordinated:
    name: Installed product update and legacy migration
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: npm test
      - run: npm ci --ignore-scripts --prefix assembly/coordinated
      - run: node assembly/coordinated/test.mjs
      - run: node assembly/coordinated/store-migration-acceptance.mjs
      - name: Build and accept the product installer on a disposable worker
        run: node assembly/coordinated-candidate.mjs
